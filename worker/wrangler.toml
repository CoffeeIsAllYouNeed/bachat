# Bachat AI proxy — a free Cloudflare Worker that keeps the Gemini key off the phone.
#   npx wrangler secret put GEMINI_API_KEY     # required
#   npx wrangler secret put APP_TOKEN          # optional, must match EXPO_PUBLIC_AI_APP_TOKEN
#   npx wrangler deploy
# Then set EXPO_PUBLIC_AI_PROXY_URL=https://bachat-ai-proxy.<you>.workers.dev in the app's .env.

name = "bachat-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Browser origins allowed to call the proxy (the web build). Phones send no Origin header.
ALLOWED_ORIGINS = "http://localhost:8081"
# Models the app may ask for (must include the app's fallback list).
ALLOWED_MODELS = "gemini-flash-latest,gemini-flash-lite-latest,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite"
# Requests per minute per IP (best effort, per Worker instance). Add a Cloudflare rate-limiting rule for a hard limit.
RATE_LIMIT_PER_MIN = "30"
# Largest request body in MB (PDF statements and voice notes are sent inline as base64).
MAX_BODY_MB = "10"
